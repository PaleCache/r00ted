.overlay-mute { width: 14px; height: 14px; opacity: 0.9; filter: brightness(0) saturate(100%) invert(13%) sepia(99%) saturate(3465%) hue-rotate(0deg) brightness(104%); }

@keyframes glitch1 {
  0% { clip: rect(25px, 9999px, 50px, 0); }
  5% { clip: rect(10px, 9999px, 80px, 0); }
  10% { clip: rect(60px, 9999px, 90px, 0); }
}

@keyframes glitch2 {
  0% { clip: rect(80px, 9999px, 120px, 0); }
  5% { clip: rect(30px, 9999px, 70px, 0); }
  10% { clip: rect(50px, 9999px, 100px, 0); }
}

@keyframes matrixCodeChars {
  0% {
    transform: translateY(-100%);
    opacity: 0;
  }
  10% {
    opacity: 0.6;
  }
  90% {
    opacity: 0.6;
  }
  100% {
    transform: translateY(100%);
    opacity: 0;
  }
}

@keyframes matrixCodeGlitch {
  0% {
    transform: translateY(-100%) translateX(0);
    opacity: 0;
  }
  20% {
    opacity: 0.8;
  }
  50% {
    transform: translateY(0) translateX(2px);
    opacity: 0.9;
  }
  80% {
    opacity: 0.8;
  }
  100% {
    transform: translateY(100%) translateX(-2px);
    opacity: 0;
  }
}

@keyframes matrixRain { 
  0% { background-position: 0% 0%; } 
  100% { background-position: 0% 220%; } 
}

@keyframes matrixGlitch { 
  0%,100% { transform: translate(0); }
  25% { transform: translate(-3px, 2px); }
  50% { transform: translate(3px, -2px); }
  75% { transform: translate(-2px, 2px); }
}

@keyframes matrixCodeChars {
  0%   { transform: translateY(-150%); opacity: 0; }
  10%  { opacity: 0.8; }
  90%  { opacity: 0.8; }
  100% { transform: translateY(150%); opacity: 0; }
}

.overlay-username.username-glitch {
  position: relative;
}
.overlay-username.username-glitch.speaking::before,
.overlay-username.username-glitch.speaking::after {
  content: attr(data-text);
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0.8;
  pointer-events: none;
  background: linear-gradient(90deg,#00ffcc,#ff00ff,#00ffcc);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.overlay-username.username-glitch.speaking::before {
  animation: glitch1 0.6s infinite !important;
  color: #00ffff !important;
  left: 2px !important;
  text-shadow: -2px 0 #ff00ff !important;
  clip: rect(0, 900px, 0, 0);
}
.overlay-username.username-glitch.speaking::after {
  animation: glitch2 0.4s infinite !important;
  color: #ff00ff !important;
  left: -2px !important;
  text-shadow: 2px 0 #00ffff !important;
  clip: rect(0, 900px, 0, 0);
}


span.overlay-username.username-matrix-code.speaking::before {
    content: attr(data-text);
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    opacity: 0.7;
    animation: matrixCodeGlitch 2s linear infinite;
    color: #00ff41;
    text-shadow: 0 0 10px #00ff41;
    -webkit-clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%, 0 65%, 100% 65%, 100% 100%, 0 100%);
    clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%, 0 65%, 100% 65%, 100% 100%, 0 100%);
}

.overlay-username.username-matrix-code.speaking::after {
  content: '01 10 11 00 01 10 01 11' !important;
  position: absolute !important;
  left: -40px !important; 
  top: 0 !important;
  width: 300% !important;
  height: 100% !important;
  opacity: 0.55 !important;
  animation: matrixCodeChars 1.7s linear infinite !important;
  color: #00dd44 !important;
  font-size: 0.75em !important;
  letter-spacing: 3px !important;
  white-space: nowrap !important;
  pointer-events: none !important;
  z-index: 3;
}


.overlay-username.username-corrupted.speaking{
    animation: corruptedGlitch 0.4s linear infinite !important;
    text-shadow: 2px 2px 0px #ff0080, -2px -2px 0px #7928ca, 0px 0px 20px #ff0080;
}

.overlay-username.username-corrupted.speaking::before {
  position: absolute !important;
  left: 0 !important;
  top: 0 !important;
  width: 100% !important;
  height: 100% !important;
  opacity: 0.8 !important;

}

.overlay-username.username-corrupted.speaking::after {

  left: 0 !important;

}

window.overlayAPI.onMusicLevel((level) => {
  const threshold = 0.03;
  if (level < threshold) {
    musicArt.style.outline = 'none';
    musicArtFallback.style.outline = 'none';
    return;
  }
  const width = Math.min(8, 2 + level * 6);
  const outline = `${width}px solid #FF0000`;
  musicArt.style.outline = outline;
  musicArtFallback.style.outline = outline;
});

function resolveUrl(src) {
  if (!src) return '';
  if (src.startsWith('http') || src.startsWith('data:') || src.startsWith('blob:')) return src;
  const base = SERVER_ORIGIN.replace(/\/$/, '');
  const path = src.startsWith('/') ? src : `/${src}`;
  return `${base}${path}`;
}

if (window.overlayAPI.onMusicUpdate) {

  if (!data) {
    musicWidget.style.display = 'none';
    musicArt.style.outline = 'none';
    musicArtFallback.style.outline = 'none';
    return;
  }
    musicTitle.textContent = data.title || '';
    musicArtist.textContent = data.artist || '';

    if (data.artUrl) {
      musicArt.src = resolveUrl(data.artUrl);
      musicArt.style.display = 'block';
      musicArtFallback.style.display = 'none';
    } else {
      musicArt.style.display = 'none';
      musicArtFallback.style.display = 'flex';
    }

    syncWidgetStackPosition();
    musicWidget.style.display = 'flex';
  });
}


function getLevelColor(level) {
  const hue = (level * 137.508) % 360;
  const saturation = 70 + (level % 3) * 10;
  const lightness = 55 + (level % 2) * 10;
  return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
}

const pingIndicator = document.getElementById('pingIndicator');
const pingDivider = document.getElementById('pingDivider');
const pingTextEl = document.getElementById('pingText');
const pingBarsIcon = document.getElementById('pingBarsIcon');

function getPingColor(ping) {
  if (ping === null || ping <= 0) return '#888888';
  if (ping < 170) return '#23a559';
  if (ping < 190) return '#f0b232';
  return '#ff3333';
}

function getPingBarCount(ping) {
  if (ping === null || ping <= 0) return 0;
  if (ping < 100) return 4;
  if (ping < 170) return 3;
  if (ping < 190) return 2;
  return 1;
}

function buildParticipantEl(p) {
  const el = document.createElement('div');
  el.className = 'vp';
  el.dataset.id = p.id;

  const avatarUrl = resolveUrl(p.avatar);
  const level = p.level || 1;
  const lvlColor = getLevelColor(level);

  let badgesHtml = '';
  if (p.badge) badgesHtml += `<img class="overlay-badge" src="${resolveUrl(p.badge)}">`;
  if (p.prestigeBadge) badgesHtml += `<img class="overlay-prestige" src="${resolveUrl(p.prestigeBadge)}">`;
  if (p.isAdmin) {
    badgesHtml += `
      <svg viewBox="0 0 16 16" width="16" height="16" title="Admin">
        <path d="M2 13 L2.8 7.5 L5.5 10 L8 3.5 L10.5 10 L13.2 7.5 L14 13 Z" fill="#f0b232"/>
        <rect x="2" y="13" width="12" height="1.8" rx="0.9" fill="#f0b232"/>
        <circle cx="8" cy="3.5" r="1.2" fill="#f0b232"/>
        <circle cx="2.8" cy="7.5" r="1.1" fill="#f0b232"/>
        <circle cx="13.2" cy="7.5" r="1.1" fill="#f0b232"/>
      </svg>`;
  }

  if (p.isDeveloper && p.devBadgeUrl) badgesHtml += `<img class="overlay-badge" src="${p.devBadgeUrl}" title="Developer">`;
  if (p.isPromptEngineer && p.promptEngineerBadgeUrl) badgesHtml += `<img class="overlay-badge" src="${p.promptEngineerBadgeUrl}" title="Prompt Engineer" style="filter:brightness(0) invert(1) sepia(1) saturate(5) hue-rotate(240deg);">`;

  (p.customRoles || []).forEach(role => {
  const hasName = role.name && role.name.trim() !== "";
  if (!hasName && role.badge) {
    badgesHtml += `<img class="overlay-badge" src="${resolveUrl(role.badge)}" title="${role.name || 'Custom Role'}">`;
    return;
  }
  const textColor = getReadableTextColorOverlay(role.color);
  const badgeImg = role.badge
    ? `<img src="${resolveUrl(role.badge)}" style="width:14px;height:14px;object-fit:contain;vertical-align:middle;margin-right:4px;border-radius:3px;">`
    : '';
  badgesHtml += `
    <span style="
      font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px;
      display:inline-flex; align-items:center; vertical-align:middle; white-space:nowrap;
      background:${role.color}; color:${textColor}; border:1px solid rgba(0,0,0,0.25);
      box-shadow:0 0 6px ${role.color}66; margin-left:4px;
    ">${badgeImg}${role.name}</span>`;
});
  const muteIcon = p.isMuted ? `<img class="overlay-mute mute-icon" width="14" height="14" src="${resolveUrl('/avatars/svgs/mic-on.svg')}" title="Muted">` : '';
  const deafenIcon = p.isDeafened ? `<img class="overlay-mute deafen-icon" width="14" height="14" src="${resolveUrl('/avatars/svgs/def.svg')}" title="Deafened">` : '';



el.innerHTML = `
    <img class="avatar" src="${avatarUrl}">
    <div>
      <div class="overlay-meta">
        <span class="overlay-username"></span>
        <span class="overlay-level" style="color:${lvlColor};">${level}</span>
        ${muteIcon}
        ${deafenIcon}
        ${badgesHtml}
      </div>
    </div>
  `;

  el.dataset.staticSig = JSON.stringify([p.avatar, p.badge, p.prestigeBadge, p.isAdmin, p.isDeveloper, p.isPromptEngineer, p.isMuted, p.isDeafened, level,p.customRoles]);
  applySpeakingState(el, p);
  return el;
}

function getReadableTextColorOverlay(color) {
  let r, g, b;
  if (color.startsWith('rgba') || color.startsWith('rgb')) {
    const nums = color.match(/[\d.]+/g);
    r = parseInt(nums[0]); g = parseInt(nums[1]); b = parseInt(nums[2]);
  } else {
    r = parseInt(color.slice(1, 3), 16);
    g = parseInt(color.slice(3, 5), 16);
    b = parseInt(color.slice(5, 7), 16);
  }
  const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return luminance > 0.55 ? "#111214" : "#ffffff";
}

function applySpeakingState(el, p) {
  const nameEl = el.querySelector('.overlay-username');
  const avatarEl = el.querySelector('.avatar');
  const meta = COLOR_META[p.usernameColor];
  const flatColor = colorClassToHex[p.usernameColor] || '#00f2ff';
  console.log('usernameColor:', p.usernameColor);
  nameEl.textContent = p.username;
  nameEl.setAttribute('data-text', p.username);
  let classes = 'overlay-username';
  if (p.usernameColor) {
    classes += ' ' + p.usernameColor;
  }
  if (p.speaking) {
    classes += ' speaking';
  }
  nameEl.className = classes;

  const wasSpeaking = el.dataset.wasSpeaking === '1';
  const colorChanged = el.dataset.animColor !== p.usernameColor;

  let nameStyle = '';
  if (meta) {
    nameStyle = `background:${meta.bg};${meta.bgSize ? `background-size:${meta.bgSize};` : ''}-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;`;
    if (p.speaking && meta.anim) nameStyle += `animation:${meta.anim};`;
  } else {
    nameStyle = `color:${flatColor};`;
  }
  if (meta && meta.shadow) {
    nameStyle += `text-shadow:${meta.shadow};`;
  }
  if (wasSpeaking !== p.speaking || colorChanged) {
    nameEl.style.cssText = nameStyle;

    const borderColor = p.speaking ? (p.avatarBorderColor || flatColor) : 'transparent';
    const avatarAnim = p.speaking ? (AVATAR_ANIM[p.usernameColor] || '') : '';
    avatarEl.style.cssText = `border-color:${borderColor};${avatarAnim ? `animation:${avatarAnim};` : ''}`;
  }

  el.dataset.wasSpeaking = p.speaking ? '1' : '0';
  el.dataset.animColor = p.usernameColor;
  el.classList.toggle('speaking', !!p.speaking);
  el.dataset.speakSig = JSON.stringify([p.speaking, p.usernameColor, p.avatarBorderColor]);
}


window.overlayAPI.onPingUpdate((ping) => {
  if (ping === null || ping === undefined) {
    pingIndicator.style.display = 'none';
    pingDivider.style.display = 'none';
    return;
  }
  pingIndicator.style.display = 'flex';
  pingDivider.style.display = 'block';

  const color = getPingColor(ping);
  const activeBars = getPingBarCount(ping);

  pingTextEl.textContent = ping > 0 ? `${ping}ms` : '--';
  pingTextEl.style.color = color;
  pingBarsIcon.style.color = color;

  pingBarsIcon.querySelectorAll('rect').forEach((rect, i) => {
    rect.setAttribute('opacity', i < activeBars ? '1' : '0.3');
  });
});

window.overlayAPI.onVoiceUpdate((participants) => {
  const incomingIds = new Set(participants.map(p => p.id));

  [...panel.children].forEach(el => {
    if (!incomingIds.has(el.dataset.id)) el.remove();
  });

  participants.forEach(p => {
    let el = panel.querySelector(`[data-id="${p.id}"]`);
   const staticSig = JSON.stringify([p.avatar, p.badge, p.prestigeBadge, p.isAdmin, p.isDeveloper, p.isPromptEngineer, p.isMuted, p.isDeafened, p.level || 1, p.customRoles]);

    if (!el) {
      el = buildParticipantEl(p);
      panel.appendChild(el);
      return;
    }

    if (el.dataset.staticSig !== staticSig) {
      const newEl = buildParticipantEl(p);
      el.replaceWith(newEl);
      return;
    }

    const speakSig = JSON.stringify([p.speaking, p.usernameColor, p.avatarBorderColor]);
    if (el.dataset.speakSig !== speakSig) {
      applySpeakingState(el, p);
    }
  });
});

window.overlayAPI.onReposition((pos) => {
  panel.style.left = pos.x + 'px';
  panel.style.top = pos.y + 'px';
  syncWidgetStackPosition();
  brandWidget.style.display = 'flex';
});
